<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search results for "pure CSS" - Forum</title>
  <style>
    :root {
      --bg-color: #0e1113;
      --card-bg: #1a1a1b;
      --card-hover: #272729;
      --border-color: #343536;
      --text-main: #d7dedd;
      --text-muted: #818384;
      --accent-color: #ff4500;
      --accent-hover: #e03d00;
      --input-bg: #272729;
      --highlight-bg: rgba(255, 69, 0, 0.2);
      --highlight-color: #ff6a33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-top: 56px;
    }

    /* --- TOP NAVBAR --- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background-color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo svg {
      fill: #ffffff;
      width: 20px;
      height: 20px;
    }

    .nav-search {
      flex: 1;
      max-width: 600px;
      margin: 0 16px;
    }

    .search-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 16px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #ffffff;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-create {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
    }

    .user-profile {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #343536;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* --- SEARCH NAVIGATION & FILTER TABS --- */
    .search-subnav {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
    }

    .subnav-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .tab-link {
      padding: 14px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      position: relative;
      white-space: nowrap;
    }

    .tab-link:hover {
      color: var(--text-main);
    }

    .tab-link.active {
      color: #ffffff;
    }

    .tab-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--accent-color);
    }

    /* --- MAIN LAYOUT GRID --- */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 24px;
      padding: 0 16px;
    }

    /* --- RESULTS HEADER & SORTING --- */
    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .sort-select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* --- RESULTS FEED --- */
    .results-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s;
    }

    .result-card:hover {
      border-color: #818384;
    }

    .result-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .subreddit-name {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .subreddit-name:hover {
      text-decoration: underline;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 8px;
      display: block;
      line-height: 1.3;
    }

    .result-title:hover {
      color: var(--text-main);
    }

    .result-snippet {
      font-size: 0.85rem;
      color: #c8cecd;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* Highlighted text matches */
    mark {
      background-color: var(--highlight-bg);
      color: var(--highlight-color);
      padding: 0 2px;
      border-radius: 2px;
    }

    .result-footer {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* --- SIDEBAR COMMUNITIES RESULT --- */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-widget {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .widget-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .community-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .community-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .community-info {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
    }

    .community-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffffff;
    }

    .community-details {
      display: flex;
      flex-direction: column;
    }

    .community-members {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .btn-join {
      background-color: var(--text-main);
      color: var(--bg-color);
      border: none;
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
      <span>QForum</span>
    </a>

    <div class="nav-search">
      <form action="{{ url_for('search')}}" method="get">
      <input name="search" type="text" class="search-input" placeholder="{{query}}">
      
      </div><button type="submit" class="btn-create">Search</button></form>
    </div>

    <div class="nav-actions">
      <a href="/create-post" class="btn-create">+ Create</a>
      <div class="user-profile" title="User Profile">U</div>
    </div>
  </header>
  <nav class="search-subnav">
    <div class="subnav-container">
      <a href="#" class="tab-link active">Posts</a>
    </div>
  </nav>
  <main class="container">
    
    <!-- Results Column -->
    <section class="results-feed">
    {% for u in results %}
      <article class="result-card">
        <div class="result-meta">
          <a class="subreddit-name">{{u.topic}}</a>
          <span>•</span>
          <span>Posted by {{u.author_id}} at {{u.created_at}} UTC</span>
        </div>
        <a href="/post/{{u.id}}" class="result-title">{{u.title}}</a>
        <p class="result-snippet">
          {{u.body}}
        <div class="result-footer">
          <a href="/post/{{u.id}}">view comments</a>
        </div>
      </article>
{% endfor %}
    </section>

    <!-- Sidebar (Related Communities matching search) -->
    <aside class="sidebar">
      <div class="sidebar-widget">
        <h2 class="widget-title">Matching Topics</h2>
        <ul class="community-list">
            {% for u in results%}
          <li class="community-item">
            <a href="#" class="community-info">
              <div class="community-icon">{{u.topic[0]}}</div>
              <div class="community-details">
                <span>{{u.topic}}</span>
              </div>
            </a>
          </li>
          {%endfor%}
        </ul>
      </div>
    </aside>

  </main>

</body>
</html>
