<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style3.css') }}">
  <title>Create a Post-QForum</title>
  </head>
  <body>

  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
      <span>QForum</span>
    </a>
    <div class="user-profile" title="User Profile">U</div>
  </header>

  <main class="create-post-container">
    {% if editing %}
    <h1 class="page-title">Edit your post</h1>
    <form class="post-form" method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
    {% else %}
    <h1 class="page-title">Create a post</h1>
    <form class="post-form" method="POST" action="{{ url_for('create_post') }}">
    {% endif %}
      
      <div class="form-group">
        <label for="topic">Choose a topic</label>
        <input type="text" name="topic" class="input" placeholder="Topic Name" value="{{ post.topic if editing else '' }}" />
      </div>
      <div class="form-group">

        <label for="title">Title</label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          class="post-input" 
          placeholder="Title (max 200 characters)" 
          maxlength="200" 
          required
          value="{{ post.title if editing else '' }}"
        >
      </div>

      <div class="form-group">
        <label for="body">Post Text</label>
        <textarea 
          id="body" 
          name="body" 
          class="post-textarea" 
          placeholder="Text (optional post body context...)"
        >{{ post.body if editing else '' }}</textarea>
      </div>

      <div class="form-actions">
        <a href="/" class="btn btn-cancel">Go Back</a>
        <button type="submit" class="btn btn-submit">{{ 'Save Changes' if editing else 'Post' }}</button>
      </div>

    </form>
  </main>
  </body>
  </html>
